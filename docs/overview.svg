<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="netcap use game: one device caps laptop and server over ssh, gamepc keeps the full line">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .fg { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent { fill: #e4572e; }
    .card { fill: #f3f4f6; stroke: #d1d5db; }
    .term { fill: #111827; }
    .ssh { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .pipe { stroke: #9ca3af; fill: none; stroke-linecap: round; }
    .capped { stroke: #e4572e; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #161b22; stroke: #30363d; }
      .term { fill: #010409; stroke: #30363d; }
    }
  </style>
  <defs>
    <g id="cap">
      <path class="accent" d="M0 10 A11 9 0 0 1 22 10 Z"/>
      <rect class="accent" x="17" y="8" width="11" height="2.5" rx="1.2"/>
    </g>
    <g id="cap-off" fill="none" stroke="#9ca3af" stroke-width="1.5">
      <path d="M0 10 A11 9 0 0 1 22 10 Z"/>
      <rect x="17" y="8" width="11" height="2.5" rx="1.2"/>
    </g>
  </defs>

  <!-- the device you control from -->
  <rect class="term" x="16" y="90" width="236" height="124" rx="10"/>
  <text class="mono" xml:space="preserve" x="32" y="120" fill="#e5e7eb">$ netcap use game</text>
  <text class="mono" xml:space="preserve" x="32" y="150" fill="#f59e7d">laptop  ↑2 ↓2 Mbit/s</text>
  <text class="mono" xml:space="preserve" x="32" y="172" fill="#f59e7d">server  ↑1 ↓1 Mbit/s</text>
  <text class="mono" xml:space="preserve" x="32" y="194" fill="#9ca3af">gamepc  off</text>
  <text class="muted" x="134" y="236" font-size="13" text-anchor="middle">your device</text>

  <!-- ssh -->
  <path class="ssh" d="M252 152 C296 152 296 50 336 50"/>
  <path class="ssh" d="M252 152 L336 150"/>
  <path class="ssh" d="M252 152 C296 152 296 250 336 250"/>
  <text class="muted" x="292" y="142" font-size="12" text-anchor="middle">ssh</text>

  <!-- links: line width = available bandwidth -->
  <path class="pipe capped" stroke-width="3" d="M536 50 C580 50 580 146 616 146"/>
  <path class="pipe capped" stroke-width="2" d="M536 150 L616 150"/>
  <path class="pipe" stroke-width="12" d="M536 250 C580 250 580 156 616 156"/>

  <!-- devices -->
  <rect class="card" x="336" y="20" width="200" height="60" rx="10"/>
  <text class="fg" x="352" y="46" font-size="16" font-weight="700">laptop</text>
  <text class="muted" x="352" y="66" font-size="12">macOS · 2 Mbit/s</text>
  <use href="#cap" x="494" y="30"/>

  <rect class="card" x="336" y="120" width="200" height="60" rx="10"/>
  <text class="fg" x="352" y="146" font-size="16" font-weight="700">server</text>
  <text class="muted" x="352" y="166" font-size="12">macOS · 1 Mbit/s</text>
  <use href="#cap" x="494" y="130"/>

  <rect class="card" x="336" y="220" width="200" height="60" rx="10"/>
  <text class="fg" x="352" y="246" font-size="16" font-weight="700">gamepc</text>
  <text class="muted" x="352" y="266" font-size="12">Windows · full speed</text>
  <use href="#cap-off" x="494" y="230"/>

  <rect class="card" x="616" y="126" width="72" height="48" rx="8"/>
  <text class="fg" x="652" y="155" font-size="13" text-anchor="middle">router</text>
  <path class="pipe" stroke-width="14" d="M688 150 L720 150"/>
  <text class="fg" x="756" y="155" font-size="13" text-anchor="middle">Internet</text>
</svg>
