name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -v tests

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the macOS job tests upgrading from v0.5.0, which needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The runner attaches its own eBPF filter on ingress. netcap does not share ingress with other tools, so remove it
      - if: runner.os == 'Linux'
        run: sudo tc qdisc del dev "$(ip route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')" clsact
      - run: python -m unittest -v tests/test_e2e.py
        env:
          NETCAP_E2E: "1"
          PYTHONUTF8: "1"

  # docs/platforms.md: install --ssh. The runner connects to itself through a real sshd, so the controller and the
  # device are the same machine but every step goes through ssh, scp, sudo on the device, and the forced command
  e2e-ssh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # Windows' sshd runs a forced command through its default shell: cmd.exe unless DefaultShell is set (#57)
          - os: windows-latest
            shell: cmd
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - if: runner.os == 'Linux'
        run: sudo tc qdisc del dev "$(ip route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')" clsact
      - if: runner.os == 'Linux'
        name: Start sshd and trust the runner's own key
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-server
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          printf 'Host netcap-dev\n  HostName 127.0.0.1\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          for i in $(seq 30); do ssh -o BatchMode=yes netcap-dev true && exit 0; sleep 1; done; exit 1
      # The runner user is an Administrator, so sshd reads administrators_authorized_keys (docs/host-setup.md)
      - if: runner.os == 'Windows'
        name: Start sshd and trust the runner's own key
        run: |
          where.exe ssh scp ssh-keygen
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          if ('${{ matrix.shell }}' -eq 'powershell') {
            New-Item -Path HKLM:\SOFTWARE\OpenSSH -Force | Out-Null
            New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -PropertyType String -Force `
              -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" | Out-Null
          }
          Set-Service sshd -StartupType Manual
          Start-Service sshd
          $ssh = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force $ssh | Out-Null
          # Python passes the empty passphrase as "" (as bin/netcap does), which PowerShell does not do reliably
          python -c "import subprocess, sys; subprocess.run(['ssh-keygen', '-q', '-t', 'ed25519', '-N', '', '-f', sys.argv[1]], check=True)" "$ssh\id_ed25519"
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          [IO.File]::WriteAllText($keys, (Get-Content -Raw "$ssh\id_ed25519.pub"))
          icacls.exe $keys /inheritance:r /grant:r '*S-1-5-18:F' '*S-1-5-32-544:F'
          [IO.File]::WriteAllText("$ssh\config", "Host netcap-dev`n  HostName 127.0.0.1`n  StrictHostKeyChecking accept-new`n")
          for ($i = 0; $i -lt 30; $i++) {
            ssh -o BatchMode=yes netcap-dev echo ok
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 1
          }
          exit 1
      - run: python -m unittest -v tests/test_e2e_ssh.py
        env:
          NETCAP_E2E_SSH: netcap-dev
          PYTHONUTF8: "1"

  # docs/platforms.md: install with brew on Linux. The runner image has Homebrew in /home/linuxbrew, off the PATH.
  # The formula builds the released tag, not this commit: this checks that the formula and the release work on Linux
  brew-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          git checkout -q -B ci  # brew tap clones this checkout, which is a detached HEAD
          brew tap ken-ty/netcap "$GITHUB_WORKSPACE"
          brew install netcap
          brew test netcap
          netcap --version
          # The device side comes from libexec: the Linux installer runs, and the agent answers
          export NETCAP_CONFIG_DIR="$(mktemp -d)"
          netcap install me --boot off
          netcap get me
          netcap uninstall me
